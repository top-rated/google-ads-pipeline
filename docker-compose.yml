services:
  google-ads-pipeline:
    build: .
    container_name: google-ads-pipeline
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./campaigns.yaml:/app/campaigns.yaml:ro
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
